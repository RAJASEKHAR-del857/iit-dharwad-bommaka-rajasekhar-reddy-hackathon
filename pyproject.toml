[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelrisk-ai"
version = "1.0.0"
description = "Explainable financial event intelligence and portfolio risk simulation"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24,<3",
  "pandas>=2.0,<3",
  "pydantic>=2.5,<3",
  "fastapi>=0.110,<1",
  "uvicorn>=0.27,<1",
  "streamlit>=1.32,<2",
  "plotly>=5.18,<7",
  "feedparser>=6.0,<7",
  "requests>=2.31,<3"
]

[project.optional-dependencies]
nlp = ["transformers>=4.38,<5", "torch>=2.1"]
test = ["pytest>=8,<9", "httpx>=0.26,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
